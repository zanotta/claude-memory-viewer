<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Claude Memory Viewer</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">Claude Memory Viewer</span>
        <span class="brand-note" title="Not affiliated with or endorsed by Anthropic. Never writes to your files.">unofficial · read-only</span>
      </div>
      <form class="search" id="search-form" role="search" autocomplete="off">
        <label class="visually-hidden" for="search-input">Search memories</label>
        <input id="search-input" type="search" placeholder="Search all memories   ( / )" spellcheck="false" maxlength="200" />
      </form>
      <div class="live" id="live" role="status" aria-live="polite"></div>
    </header>
    <div class="layout" id="layout" data-pane="projects">
      <nav class="pane" id="projects" aria-label="Projects"></nav>
      <section class="pane" id="files" aria-label="Files"></section>
      <main class="pane" id="content" tabindex="-1" aria-label="Content"></main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript><p class="noscript">This viewer needs JavaScript. It loads nothing from the network except from this local server.</p></noscript>
  </body>
</html>
